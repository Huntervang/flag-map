<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flags of the World — Map Explorer</title>
    <link href="https://unpkg.com/maplibre-gl@^6.11.2/dist/maplibre-gl.css" rel="stylesheet">
    <link href="main.css" type="text/css" rel="stylesheet">
</head>

<body>

    <div id="panel">
        <h1>🌍 Flags of the World</h1>
        <p>Every flag is pinned to the map. Click a flag to see it larger with a link to its
            Wikipedia page.</p>
        <input id="search" type="text" placeholder="Search a flag…" autocomplete="off">
        <div id="search-results"></div>
        
        <label class="toggle-control">
            <span class="toggle-label">Show names</span>
            <input type="checkbox" id="toggle-names">
            <span class="toggle-switch"></span>
        </label>

        <div id="count">Loading flags…</div>
    </div>

    <div id="legend">Tiles © <a href="https://openfreemap.org" target="_blank" style="color:inherit">OpenFreeMap</a> /
        OpenStreetMap contributors</div>

    <div id="map"></div>

    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.11.2/dist/maplibre-gl.mjs';
        const flagsResponse = await fetch("flags.json");
        const flagsJSON = await flagsResponse.json();
        const FLAGS = flagsJSON.flags;
        const LAYER_ID = 'flags-layer';
        const SOURCE_ID = 'flags-source';

        function iconUrl(code) {return `https://flagcdn.com/h40/${code}.png`;}   // small icon for the map layer
        function previewUrl(code) {return `https://flagcdn.com/w160/${code}.png`;} // bigger image for the popup

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [10, 25],
            zoom: 1.6,
            minZoom: 1,
            maxZoom: 10
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maplibregl.GlobeControl(), 'top-right');

        let loaded = 0;

        async function loadIcon(code) {
            try {
                const image = await map.loadImage(iconUrl(code));
                map.addImage(code, image.data);
                loaded += 1;
                document.getElementById('count').textContent = `${loaded}/${FLAGS.length} flags loaded`;
            } catch (e) {
                console.error(e);
            }
        }

        map.on('load', async () => {
            const results = FLAGS.map(c => loadIcon(c.code));

            const geojson = {
                type: 'FeatureCollection',
                features: FLAGS.map(c => ({
                    type: 'Feature',
                    geometry: {type: 'Point', coordinates: [c.lon, c.lat]},
                    properties: {code: c.code, name: c.name, wiki: c.wiki}
                }))
            };

            map.addSource(SOURCE_ID, {type: 'geojson', data: geojson, generateId: true});

            map.addLayer({
                id: LAYER_ID,
                type: 'symbol',
                source: SOURCE_ID,
                layout: {
                    'icon-image': ['get', 'code'],
                    'icon-size': 0.6,
                    'icon-allow-overlap': true,
                    'icon-anchor': 'center',
                    'text-offset': [0, 1],
                    'text-anchor': 'top',
                    'text-optional': true,
                    'text-allow-overlap': false,
                },
                paint: {
                    'text-color': '#333333',
                    'text-halo-color': '#FFFFFF',
                    'text-halo-width': 2,
                    'text-halo-blur': 0.5
                }
            });

            // Handle the name visibility toggle event
            document.getElementById('toggle-names').addEventListener('change', (e) => {
                const showNames = e.target.checked;
                map.setLayoutProperty(
                    LAYER_ID, 
                    'text-field', 
                    showNames ? ['get', 'name'] : ''
                );
            });

            // Click: popup with bigger flag + Wikipedia link
            map.on('click', LAYER_ID, (e) => {
                const feature = e.features[0]
                const p = feature.properties;
                const coordinates = feature.geometry.coordinates;
                new maplibregl.Popup({offset: 14, closeButton: true, maxWidth: '220px'})
                    .setLngLat(coordinates)
                    .setHTML(`
        <img class="popup-flag" src="${previewUrl(p.code)}" alt="Flag of ${p.name}">
        <div class="popup-name">${p.name}</div>
        <a class="popup-link" href="${p.wiki}" target="_blank" rel="noopener">View on Wikipedia →</a>
      `)
                    .addTo(map);
            });
        });

        const searchInput = document.getElementById('search');
        const searchResults = document.getElementById('search-results');

        let currentMatches = [];
        let selectedIndex = -1;

        function selectAndFlyTo(index) {
            if (index < 0 || index >= currentMatches.length) return;

            selectedIndex = index;
            const flag = currentMatches[selectedIndex];

            map.flyTo({
                center: [flag.lon, flag.lat],
                zoom: 5,
                speed: 5
            });
        }

        function showSearchResults(matches) {
            searchResults.innerHTML = '';

            if (!matches.length) {
                searchResults.style.display = 'none';
                selectedIndex = -1;
                return;
            }

            matches.forEach((flag, index) => {
                const result = document.createElement('div');
                result.className = 'search-result';
                result.dataset.index = index;

                result.innerHTML = `
                    <img src="${iconUrl(flag.code)}" alt="">
                    <span class="search-result-name">${flag.name}</span>
                `;

                result.addEventListener('click', () => {
                    selectedIndex = index;
                    updateSelectedResult();
                    selectAndFlyTo(index);
                });

                searchResults.appendChild(result);
            });

            searchResults.style.display = 'block';
            updateSelectedResult();
        }

        function updateSelectedResult() {
            const results = searchResults.querySelectorAll('.search-result');

            results.forEach((result, index) => {
                result.classList.toggle('selected', index === selectedIndex);
            });

            if (selectedIndex >= 0 && results[selectedIndex]) {
                results[selectedIndex].scrollIntoView({
                    block: 'nearest'
                });
            }
        }

        function clearSearch() {
            searchInput.value = '';
            currentMatches = [];
            selectedIndex = -1;

            map.setFilter(LAYER_ID, null);
            searchResults.style.display = 'none';

            document.getElementById('count').textContent =
                `${FLAGS.length} flags loaded`;
        }

        function updateSearch() {
            const q = searchInput.value.trim().toLowerCase();

            if (!map.getLayer(LAYER_ID)) return;

            if (!q) {
                clearSearch();
                return;
            }

            currentMatches = FLAGS.filter(flag =>
                flag.name.toLowerCase().includes(q)
            );

            map.setFilter(
                LAYER_ID,
                ['!=', ['index-of', q, ['downcase', ['get', 'name']]], -1]
            );

            document.getElementById('count').textContent =
                `${currentMatches.length} match${currentMatches.length === 1 ? '' : 'es'}`;

            showSearchResults(currentMatches);
        }

        searchInput.addEventListener('input', () => {
            updateSearch();
            selectedIndex = 0;
            updateSelectedResult();
            selectAndFlyTo(selectedIndex);
        });
        searchInput.addEventListener('focus', updateSearch);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                clearSearch();
            }

            if (!currentMatches.length) return;

            if (e.key === 'ArrowDown' || (e.key === 'Tab' && !e.shiftKey)) {
                e.preventDefault();
                searchResults.style.display = 'block';
                selectedIndex = (selectedIndex + 1) % currentMatches.length;
                updateSelectedResult();
                selectAndFlyTo(selectedIndex);
                return;
            }

            if (e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey)) {
                e.preventDefault();
                searchResults.style.display = 'block';
                selectedIndex = (selectedIndex - 1 + currentMatches.length) % currentMatches.length;
                updateSelectedResult();
                selectAndFlyTo(selectedIndex);
                return;
            }
        });
    </script>
</body>

</html>
